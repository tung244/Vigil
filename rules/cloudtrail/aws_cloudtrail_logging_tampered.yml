title: AWS CloudTrail Logging Disabled or Tampered
id: 5d3a9c2e-1f8b-4e7a-9c0d-2e5f8a1b3c03
status: stable
description: Detects attempts to stop, delete or weaken CloudTrail logging — a classic defense-evasion move.
author: SigmaHQ (adapted for Vigil)
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: cloudtrail.amazonaws.com
    eventName:
      - StopLogging
      - DeleteTrail
      - UpdateTrail
      - PutEventSelectors
  condition: selection
level: critical
