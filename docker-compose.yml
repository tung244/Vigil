services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vigil-postgres
    environment:
      POSTGRES_USER: vigil
      POSTGRES_PASSWORD: vigil_dev_password
      POSTGRES_DB: vigil
    # Host port 55432 because 5432 is already taken by a local Postgres service.
    ports:
      - "55432:5432"
    volumes:
      - vigil-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigil -d vigil"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: vigil-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: vigil
      RABBITMQ_DEFAULT_PASS: vigil_dev_password
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    volumes:
      - vigil-rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  vigil-pgdata:
  vigil-rabbitdata:
